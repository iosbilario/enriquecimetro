name: Atualizar dados do TSE

on:
  schedule:
    # Diariamente às 08:23 UTC (05:23 em Brasília). Horário "quebrado" de
    # propósito: evita os picos de carga do agendador do GitHub.
    - cron: "23 8 * * *"
  workflow_dispatch: {}

# Evita loop: este workflow NÃO dispara em push. O commit que ele cria
# aciona apenas o deploy do Pages, que não commita nada.
permissions:
  contents: write
  actions: write  # necessário para despachar o deploy-pages.yml ao final

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: python -m unittest discover -s tests -v

      - name: Executar pipeline (download + ETL + validação + publicação)
        run: python scripts/run_pipeline.py

      - name: Commitar dados atualizados (somente se houver mudanças)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data c/ sitemap.xml robots.txt llms.txt index.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados publicados."
          else
            git commit -m "chore(data): atualização automática dos dados do TSE"
            # Rebase antes do push: outro commit pode ter chegado durante o ETL.
            # Em conflito nos dados gerados, prevalece a versão recém-gerada.
            git pull --rebase -X theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy do site
        # Commits feitos com GITHUB_TOKEN não disparam outros workflows
        # (proteção anti-recursão); despachamos o deploy explicitamente.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
